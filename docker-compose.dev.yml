# =============================================================================
# EKAA Docker Compose Development Override (§32.3)
# =============================================================================

services:
  web:
    build:
      target: dev
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"

  app:
    volumes:
      - ./apps/core:/var/www/html
    ports:
      - "127.0.0.1:8000:8000"

  connector:
    volumes:
      - ./apps/connector:/var/www/html
    ports:
      - "127.0.0.1:8080:8080"

  ai-api:
    volumes:
      - ./services/ai:/app
    ports:
      - "127.0.0.1:8001:8000"
    command: ["uvicorn", "ekaa_ai.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  valkey:
    ports:
      - "127.0.0.1:6379:6379"

  objectstore:
    ports:
      - "127.0.0.1:8333:8333"
