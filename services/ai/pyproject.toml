[project]
name = "ekaa-ai"
version = "0.1.0"
description = "EKAA AI Service - Retrieval, RAG, Hybrid Router, & Deterministic Metric Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.8",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.6",
    "sqlalchemy>=2.0.38",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.4",
    "pgvector>=0.3.6",
    "duckdb>=1.1.3",
    "openpyxl>=3.1.5",
    "pypdf>=5.3.0",
    "python-docx>=1.1.2",
    "boto3>=1.36.18",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.10.1",
    "structlog>=25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "ruff>=0.9.6",
    "mypy>=1.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
